# The nightly the prototype is built with: the one the Asterinas tree at
# commit ab9a4cfdc names, so that vOSTD and the kernels proper compile with the
# compiler OSTD does. Only `rust-src` is needed beyond the compiler, for
# -Zbuild-std, and only the kernel target.
[toolchain]
channel = "nightly-2026-07-21"
components = ["rust-src"]
targets = ["x86_64-unknown-none"]
